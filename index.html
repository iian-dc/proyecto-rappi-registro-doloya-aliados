<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Registro de Aliados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:#D50012}
.wrap{max-width:430px;margin:0 auto;background:#D50012;padding-bottom:14px;overflow:hidden}
.top-img{width:100%;display:block;line-height:0;margin:0}
.top-img img{width:100%;height:auto;display:block}
.card{background:#fff;border-radius:28px;margin:-2px 12px 0;padding:20px 13px 18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.field{position:relative;display:flex;align-items:center;gap:11px;background:#F0F0F0;border-radius:999px;padding:12px 38px 12px 12px;margin-bottom:11px;border:1px solid #E8E8E8}
.field svg.icon{width:30px;height:30px;flex-shrink:0}
.field input,.field select{border:none;background:transparent;outline:none;width:100%;font-size:14.5px;color:#4A4A4A;font-weight:500;min-width:0}
.field input::placeholder{color:#6A6A6A}
.field select{appearance:none;cursor:pointer}
.field .chev{width:17px;height:17px;flex-shrink:0;position:absolute;right:34px;pointer-events:none}
.clear{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:19px;height:19px;background:rgba(0,0,0,.06);color:#999;border:none;font-size:11px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center;border-radius:50%}
.clear.show{display:flex}
.file-row{cursor:pointer;padding-right:13px}
.file-row span{flex:1;font-size:14px;color:#5A5A5A;font-weight:500;line-height:1.2}
.file-row .cam{width:32px;height:32px;flex-shrink:0}
#preview{width:100%;height:170px;object-fit:cover;border-radius:16px;display:none;margin:-2px 0 11px}
.secure{display:flex;align-items:center;gap:9px;background:#FFD7DE;border-radius:14px;padding:8px 11px;margin-bottom:13px}
.secure .shield{width:34px;height:34px;flex-shrink:0}
.secure div{flex:1;min-width:0}
.secure b{color:#D50012;font-size:14.5px;line-height:1.1;display:block}
.secure p{font-size:11.8px;line-height:1.25;color:#1A1A1A;margin-top:2px}
.secure .wa-wrap{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.secure .wa-wrap svg{width:38px;height:38px}
.btn{width:100%;background:linear-gradient(180deg,#E60013 0%,#B0000E 100%);color:#fff;border:none;padding:14px;border-radius:999px;font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 4px 12px rgba(213,0,18,.35)}
.btn:disabled{opacity:.6}
.btn svg{width:20px;height:20px}
.footer{text-align:center;padding:16px 20px 6px;color:#fff}
.footer p{font-size:16px;font-weight:700;font-style:italic;line-height:1.2}
.footer i{display:block;width:175px;height:5px;background:#fff;border-radius:99px;margin:8px auto 0;transform:rotate(-1deg)}
#msg{font-size:13px;text-align:center;margin-top:10px;font-weight:600;color:#0A7A2E;display:none}
@media(max-width:480px){
  .wrap{max-width:100%}
  .card{margin:-2px 10px 0;padding:18px 11px 16px}
  .field input,.field select{font-size:14px}
  .btn{font-size:19px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="top-img"><img src="portada-aliados.jpg" alt="DoloYa Registro de Aliados"></div>
<div class="card">
<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M3 5l1-2h16l1 2v2.5c0 .6-.4 1-1 1H4c-.6 0-1-.4-1-1V5zm2 4h14v9H5v-9zm2.5 2.5v3h3v-3h-3zm6 0v3h3v-3h-3zM5 17h14v1.5H5V17zM7 8h1v1.5H7V8zm9 0h1v1.5h-1V8z"/></svg>
<input id="nombre" placeholder="Nombre de tu restaurante o negocio">
<button type="button" class="clear" data-clear="nombre">×</button>
</label>

<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M7 2h.8v5.5a2 2 0 0 0 1.2 1.8V21a1 1 0 0 1-2 0V9.3A2 2 0 0 0 6 7.5V2H7zm6 0c.6 0 1 .4 1 1v7.5c0 .8-.5 1.5-1.2 1.8V21a1 1 0 0 1-2 0V11.3A2 2 0 0 0 9.5 9.5V3c0-.6.4-1 1-1h2.5z"/></svg>
<select id="tipo"><option value="">Tipo de negocio</option><option>Restaurante</option><option>Taquería</option><option>Mariscos</option><option>Pizza</option><option>Hamburguesas</option><option>Café / Cafetería</option><option>Panadería</option><option>Antojitos</option><option>Otro</option></select>
<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#D50012" stroke-width="3.5"><path d="M5 8.5l7 7 7-7"/></svg>
<button type="button" class="clear" data-clear="tipo">×</button>
</label>

<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.6-6.1c-.2-.1-.9-.4-1-.5-.1-.1-.2-.1-.3 0l-.7.9c-.1.2-.2.2-.4.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4 0-.5.1-.6l.5-.6c.1-.1.1-.2 0-.4l-.5-1.1c-.1-.3-.3-.3-.4-.3h-.3c-.1 0-.3 0-.4.2-.1.2-.7.7-.7 1.7s.7 2 0.8 2.1c.1.1 1.4 2.2 3.4 3.1 1.2.5 1.6.5 2.2.4.3-.1.9-.4 1-0.7.1-.4.1-.7.1-.8 0-.1-.1-.2-.3-.3z"/></svg>
<input id="whats" type="tel" placeholder="Número de WhatsApp o Teléfono">
<button type="button" class="clear" data-clear="whats">×</button>
</label>

<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M12 1.8a7.8 7.8 0 0 0-7.8 7.8c0 5.4 7.8 12.6 7.8 12.6s7.8-7.2 7.8-12.6A7.8 7.8 0 0 0 12 1.8zm0 10.5a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z"/></svg>
<input id="direccion" placeholder="Dirección de tu establecimiento">
<button type="button" class="clear" data-clear="direccion">×</button>
</label>

<label class="field file-row" for="fotoInput">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="https://img.icons8.com/?size=100&id=ledoOw5M8qvM&format=png&color=000000"/></svg>
<span id="fileLabel">Imagen de tu negocio (logo o foto)</span>
<svg class="cam" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><path d="M2.5 7h3L7 5h10l1.5 2h3V19h-19V7z"/><circle cx="12" cy="13" r="3.5"/><circle cx="12" cy="13" r="1.3" fill="#222"/></svg>
</label>
<input type="file" id="fotoInput" accept="image/*" hidden>
<img id="preview">

<div class="secure">
<svg class="shield" viewBox="0 0 24 24" fill="#D50012"><path d="M12 1.5 20 4.5v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6L12 1.5zm-1 13.5 4.5-4.5-1.2-1.2-3.3 3.3-1.6-1.6-1.2 1.2 2.8 2.8z"/></svg>
<div><b>Tu información está segura</b><p>Una vez que completes tu registro, te enviaremos la confirmación al WhatsApp.</p></div>
<div class="wa-wrap">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#25D366"/><path fill="#fff" d="M12 6.8a5.2 5.2 0 0 0-4.5 7.9l-.6 2.2 2.3-.6A5.2 5.2 0 1 0 12 6.8zm0 9.4c-.5 0-1-.1-1.4-.3l-.3-.2-1.4.4.4-1.3-.2-.3a3.6 3.6 0 1 1 2.9 1.7zm2-2.7c-.1-.1-.4-.2-.5-.2-.2 0-.3 0-.4.2l-.4.5c-.1.1-.2.1-.3 0a2.9 2.9 0 0 1-1.5-1.3c-.1-.2 0-.3.1-.4l.3-.3c.1-.1.1-.2 0-.3l-.3-.7c-.1-.2-.2-.2-.3-.2h-.3c-.1 0-.3.1-.4.2-.2.2-.6.6-.6 1.4s.6 1.7.7 1.8c.1.1 1.3 2 3.1 2.7.4.2.7.3 1 .3.4.1.8.1 1.1-.1.3-.1.5-.3.6-.5l.3-.7c.1-.2 0-.3-.1-.4l-.7-.3z"/></svg>
</div>
</div>

<button class="btn" id="btnRegistrar" onclick="registrar()">Registrar mi negocio <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<p id="msg">✅ ¡Registro guardado! Te confirmamos por WhatsApp.</p>
</div>

<div class="footer"><p>DoloYa, tu negocio más cerca de tus clientes.</p><i></i></div>
</div>

<script>
// TU FIREBASE - doloya-registro
const firebaseConfig = {
  apiKey: "AIzaSyD462705yVQfM8McF8LxnhkR9utTlW3tkE",
  authDomain: "doloya-registro.firebaseapp.com",
  databaseURL: "https://doloya-registro-default-rtdb.firebaseio.com",
  projectId: "doloya-registro",
  storageBucket: "doloya-registro.firebasestorage.app",
  messagingSenderId: "780335945555",
  appId: "1:780335945555:web:d58cda187e9933292573a6",
  measurementId: "G-YZ15ZBRNQ1"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function setupClear(id){
  const input=document.getElementById(id);
  const btn=document.querySelector(`[data-clear="${id}"]`);
  if(!input||!btn) return;
  const toggle=()=>{ btn.classList.toggle('show', !!input.value); };
  input.addEventListener('input',toggle);
  input.addEventListener('change',toggle);
  btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation(); input.value=''; input.focus(); toggle();});
  toggle();
}
['nombre','tipo','whats','direccion'].forEach(setupClear);
document.getElementById('fotoInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('fileLabel').textContent=f.name;
  const r=new FileReader(); r.onload=ev=>{const p=document.getElementById('preview');p.src=ev.target.result;p.style.display='block';}; r.readAsDataURL(f);
});

async function registrar(){
  const nombre=document.getElementById('nombre').value.trim();
  const tipo=document.getElementById('tipo').value;
  const whats=document.getElementById('whats').value.trim();
  const dir=document.getElementById('direccion').value.trim();
  if(!nombre||!tipo||!whats||!dir){alert('Te faltó un dato. Llena todos los campos porfa');return;}
  const btn=document.getElementById('btnRegistrar');
  btn.disabled=true; btn.textContent='Guardando...';
  try{
    // GUARDAR EN FIREBASE
    await db.ref('aliados').push({
      nombre: nombre,
      tipo: tipo,
      whatsapp: whats,
      direccion: dir,
      fotoNombre: document.getElementById('fileLabel').textContent,
      fecha: new Date().toISOString(),
      estado: 'pendiente'
    });
    document.getElementById('msg').style.display='block';
    // TAMBIEN MANDAR A TU WHATSAPP
    const TU_NUMERO='5214610000000'; // CAMBIA POR TU NUMERO REAL
    const msg=`Hola DoloYa! Quiero registrar mi negocio:%0A- Negocio: ${encodeURIComponent(nombre)}%0A- Tipo: ${encodeURIComponent(tipo)}%0A- WhatsApp: ${encodeURIComponent(whats)}%0A- Dirección: ${encodeURIComponent(dir)}`;
    window.open(`https://wa.me/${TU_NUMERO}?text=${msg}`,'_blank');
    // LIMPIAR
    ['nombre','whats','direccion'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('tipo').value='';
    document.getElementById('fileLabel').textContent='Imagen de tu negocio (logo o foto)';
    document.getElementById('preview').style.display='none';
    ['nombre','tipo','whats','direccion'].forEach(id=>{
      const b=document.querySelector(`[data-clear="${id}"]`); if(b) b.classList.remove('show');
    });
  }catch(e){
    alert('Hubo un error guardando. Revisa las reglas de Firebase. Error: '+e.message);
    console.log(e);
  }
  btn.disabled=false; btn.innerHTML='Registrar mi negocio <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
}
</script>
</body>
</html>
