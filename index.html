<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Registro de Aliados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif;border-radius:0 !important}
body{background:#D50012}
.wrap{max-width:420px;margin:0 auto;background:#D50012;padding:0 0 20px}
/* PARTE DE ARRIBA - TU IMAGEN TAL CUAL */
.top-img{width:100%;display:block;line-height:0}
.top-img img{width:100%;height:auto;display:block}
/* CARD ABAJO */
.card{background:#fff;margin:0 10px;padding:18px 12px 18px;box-shadow:0 12px 30px rgba(0,0,0,.18);margin-top:-2px}
.field{position:relative;display:flex;align-items:center;gap:11px;background:#F1F1F1;padding:13px 38px 13px 13px;margin-bottom:12px;border:1px solid #EDEDED}
.field svg.icon{width:28px;height:28px;flex-shrink:0}
.field input,.field select{border:none;background:transparent;outline:none;width:100%;font-size:15.5px;color:#4A4A4A;font-weight:500;min-width:0}
.field input::placeholder{color:#6B6B6B}
.field select{appearance:none;cursor:pointer;color:#4A4A4A}
.field .chev{width:18px;height:18px;flex-shrink:0;position:absolute;right:34px;pointer-events:none}
.clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:20px;height:20px;background:rgba(0,0,0,.07);color:#888;border:none;font-size:13px;line-height:1;cursor:pointer;display:none;align-items:center;justify-content:center}
.clear.show{display:flex}
.file-row{cursor:pointer;padding-right:13px}
.file-row span{flex:1;font-size:14.5px;color:#5A5A5A;font-weight:500;line-height:1.2}
.file-row .cam{width:32px;height:32px;flex-shrink:0}
/* SECURE */
.secure{display:flex;align-items:center;gap:10px;background:#FFD7DE;padding:14px 12px;margin-bottom:16px}
.secure .shield{width:42px;height:42px;flex-shrink:0}
.secure div{flex:1;min-width:0}
.secure b{color:#D50012;font-size:16.5px;line-height:1.1;display:block}
.secure p{font-size:12.5px;line-height:1.35;color:#1A1A1A;margin-top:3px}
.secure .wa-wrap{width:46px;height:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.secure .wa-wrap svg{width:46px;height:46px}
/* BOTON */
.btn{width:100%;background:linear-gradient(180deg,#E60013 0%,#B0000E 100%);color:#fff;border:none;padding:16px;font-size:21px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 4px 0 #7A0007}
.btn svg{width:22px;height:22px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #7A0007}
.footer{text-align:center;padding:18px 20px 6px;color:#fff}
.footer p{font-size:17.5px;font-weight:700;font-style:italic;line-height:1.2}
.footer i{display:block;width:185px;height:5px;background:#fff;margin:9px auto 0;transform:rotate(-1deg)}
@media(max-width:480px){
  .wrap{max-width:100%}
  .card{margin:0 8px;padding:16px 10px}
  .btn{font-size:20px}
}
</style>
</head>
<body>
<div class="wrap">

<!-- ARRIBA TU IMAGEN -->
<div class="top-img"><img src="portada-aliados.jpg" alt="DoloYa Registro de Aliados"></div>

<!-- ABAJO TAL CUAL -->
<div class="card">
<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M2.5 8.2 4 4h16l1.5 4.2c.1.3 0 .6-.2.8-.2.2-.5.3-.8.3H3.5c-.3 0-.6-.1-.8-.3-.2-.2-.3-.5-.2-.8zM5 10h14v8H5v-8zm2 2v3h2v-3H7zm6 0v3h2v-3h-2zM4 20h16v1.5H4V20z"/></svg>
<input id="nombre" placeholder="Nombre de tu restaurante o negocio">
<button type="button" class="clear" data-clear="nombre">×</button>
</label>

<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M7.5 2h1v9.2c0 .6.4 1 1 1h.6c.6 0 1-.4 1-1V4h1v7.2c0 .6.4 1 1 1h.4c.6 0 1-.4 1-1V4h1v13.5c0 1.4-1 2.5-2.4 2.5h-3.2c-1.4 0-2.4-1.1-2.4-2.5V2zM17.8 8.5c-.5 0-.9.4-.9.9v5.1h-1v-3h-1v3h-1V8.5c0-.5-.4-.9-.9-.9H12v11c0 .8.6 1.4 1.4 1.4h3.2c.8 0 1.4-.6 1.4-1.4V9.4c0-.5-.4-.9-.9-.9z"/></svg>
<select id="tipo"><option value="">Tipo de negocio</option><option>Restaurante</option><option>Taquería</option><option>Mariscos</option><option>Pizza</option><option>Hamburguesas</option><option>Café / Cafetería</option><option>Panadería</option><option>Antojitos</option><option>Otro</option></select>
<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#D50012" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
<button type="button" class="clear" data-clear="tipo" style="right:10px">×</button>
</label>

<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M12 2.2A9.8 9.8 0 0 0 2.2 12c0 4.4 7.3 8.8 9.2 9.7.4.2.8.2 1.2 0 1.9-.9 9.2-5.3 9.2-9.7A9.8 9.8 0 0 0 12 2.2zm4.9 13.5c-.2.3-.5.5-.9.6-.4.1-.9 0-1.3-.2-.9-.5-1.7-1.3-2.3-2.1-.6-.8-.9-1.7-.7-2.3.1-.3.4-.5.7-.6l.7-.2c.2-.1.5 0 .6.2l.7 1c.1.2.1.4 0 .6l-.3.3c0 .1 0 .2.1.3.3.4.7.8 1.1 1 .1.1.2.1.3.1l.3-.3c.2-.1.4-.1.6 0l1 .7c.2.1.3.4.2.6l-.5.3z"/></svg>
<input id="whats" type="tel" placeholder="Número de WhatsApp o Teléfono">
<button type="button" class="clear" data-clear="whats">×</button>
</label>

<label class="field">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M12 2a7.5 7.5 0 0 0-7.5 7.5c0 5.2 7.5 12.5 7.5 12.5s7.5-7.3 7.5-12.5A7.5 7.5 0 0 0 12 2zm0 10.2a2.7 2.7 0 1 1 0-5.4 2.7 2.7 0 0 1 0 5.4z"/></svg>
<input id="direccion" placeholder="Dirección de tu establecimiento">
<button type="button" class="clear" data-clear="direccion">×</button>
</label>

<label class="field file-row" for="fotoInput">
<svg class="icon" viewBox="0 0 24 24" fill="#D50012"><path d="M20.5 5h-2.6l-1.2-1.6A1 1 0 0 0 15.9 3H8.1a1 1 0 0 0-.8.4L6.1 5H3.5A1.5 1.5 0 0 0 2 6.5v11A1.5 1.5 0 0 0 3.5 19h17a1.5 1.5 0 0 0 1.5-1.5v-11A1.5 1.5 0 0 0 20.5 5zM12 16.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7zm-5.5-7a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>
<span id="fileLabel">Imagen de tu negocio (logo o foto)</span>
<svg class="cam" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.7"><path d="M3 7h3.2L8 5h8l1.8 2H21v11H3z"/><circle cx="12" cy="12.5" r="3.2"/><circle cx="12" cy="12.5" r="1.2" fill="#111"/></svg>
</label>
<input type="file" id="fotoInput" accept="image/*" hidden>
<img id="preview" style="width:100%;height:180px;object-fit:cover;display:none;margin:-2px 0 12px">

<div class="secure">
<svg class="shield" viewBox="0 0 24 24" fill="#D50012"><path d="M12 2.2 19 5v5.8c0 4.7-3.2 7.9-7 9.7-3.8-1.8-7-5-7-9.7V5L12 2.2zm-.2 13.6 4.2-4.2-1.2-1.2-3 3-1.5-1.5-1.2 1.2 2.7 2.7z"/></svg>
<div><b>Tu información está segura</b><p>Una vez que completes tu registro, te enviaremos la confirmación al WhatsApp.</p></div>
<div class="wa-wrap">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#25D366"/><path fill="#fff" d="M12 6.8a5.2 5.2 0 0 0-4.5 7.9l-.6 2.2 2.3-.6A5.2 5.2 0 1 0 12 6.8zm0 9.4c-.5 0-1-.1-1.4-.3l-.3-.2-1.4.4.4-1.3-.2-.3a3.6 3.6 0 1 1 2.9 1.7zm2-2.7c-.1-.1-.4-.2-.5-.2-.2 0-.3 0-.4.2l-.4.5c-.1.1-.2.1-.3 0a2.9 2.9 0 0 1-1.5-1.3c-.1-.2 0-.3.1-.4l.3-.3c.1-.1.1-.2 0-.3l-.3-.7c-.1-.2-.2-.2-.3-.2h-.3c-.1 0-.3.1-.4.2-.2.2-.6.6-.6 1.4s.6 1.7.7 1.8c.1.1 1.3 2 3.1 2.7.4.2.7.3 1 .3.4.1.8.1 1.1-.1.3-.1.5-.3.6-.5l.3-.7c.1-.2 0-.3-.1-.4l-.7-.3z"/></svg>
</div>
</div>

<button class="btn" onclick="registrar()">Registrar mi negocio <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

<div class="footer"><p>DoloYa, tu negocio más cerca de tus clientes.</p><i></i></div>
</div>

<script>
function setupClear(id){
  const input=document.getElementById(id);
  const btn=document.querySelector(`[data-clear="${id}"]`);
  if(!input||!btn) return;
  const toggle=()=>{ btn.classList.toggle('show', !!input.value); };
  input.addEventListener('input',toggle);
  input.addEventListener('change',toggle);
  btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation(); input.value=''; input.focus(); toggle();});
  toggle();
}
['nombre','tipo','whats','direccion'].forEach(setupClear);
document.getElementById('fotoInput').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('fileLabel').textContent=f.name;
  const r=new FileReader(); r.onload=ev=>{const p=document.getElementById('preview');p.src=ev.target.result;p.style.display='block';}; r.readAsDataURL(f);
});
function registrar(){
  const nombre=document.getElementById('nombre').value.trim();
  const tipo=document.getElementById('tipo').value;
  const whats=document.getElementById('whats').value.trim();
  const dir=document.getElementById('direccion').value.trim();
  if(!nombre||!tipo||!whats||!dir){alert('Te faltó un dato. Llena todos los campos porfa');return;}
  const TU_NUMERO='5214610000000';
  const msg=`Hola DoloYa! Quiero registrar mi negocio:%0A- Negocio: ${encodeURIComponent(nombre)}%0A- Tipo: ${encodeURIComponent(tipo)}%0A- WhatsApp: ${encodeURIComponent(whats)}%0A- Dirección: ${encodeURIComponent(dir)}`;
  window.open(`https://wa.me/${TU_NUMERO}?text=${msg}`,'_blank');
}
</script>
</body>
</html>
