<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Registro de Aliados</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#D8000F;min-height:100vh}
.top{position:relative;overflow:hidden;padding:18px 18px 0;color:white}
.top-bg{position:absolute;inset:0;background:linear-gradient(135deg,#E40012 0%,#B4000E 60%,#8A000A 100%)}
.logo{position:relative;z-index:2;display:flex;flex-direction:column;line-height:.9}
.logo b{font-size:52px;font-style:italic;letter-spacing:-2px}
.logo b span{font-size:64px}
.logo small{font-size:38px;font-weight:900;font-style:italic;margin-left:4px}
.hero{position:relative;z-index:2;display:flex;gap:12px;align-items:flex-end;margin-top:14px}
.hero-text{flex:1}
.hero-text h1{font-size:34px;line-height:.95;font-weight:800}
.hero-text h1 span{font-size:52px;display:block}
.hero-text p{font-size:17px;font-weight:600;margin-top:8px;line-height:1.2}
.hero-img{width:52%;border-radius:20px 20px 0 0;overflow:hidden;flex-shrink:0}
.hero-img img{width:100%;height:210px;object-fit:cover;display:block}
.card{background:white;border-radius:28px;padding:18px 14px 20px;margin:14px 12px 0;position:relative;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.field{display:flex;align-items:center;gap:12px;background:#F1F1F1;border-radius:999px;padding:14px 14px;margin-bottom:12px}
.field .icon{font-size:28px;min-width:38px;text-align:center}
.field input,.field select{border:none;background:transparent;outline:none;width:100%;font-size:16px;color:#333}
.field select{appearance:none;cursor:pointer}
.field .arrow{color:#D8000F;font-size:22px;font-weight:900}
.file-field{cursor:pointer}
.file-field span{flex:1;font-size:15px;color:#555}
.preview{width:100%;border-radius:16px;margin:-4px 0 12px;display:none;max-height:220px;object-fit:cover}
.secure{display:flex;gap:10px;background:#FFDCE2;border-radius:18px;padding:14px;align-items:center;margin-bottom:16px}
.secure .shield{font-size:38px}
.secure b{color:#D8000F;font-size:18px}
.secure p{font-size:13.5px;line-height:1.3;color:#222;margin-top:2px}
.secure .wa{font-size:42px}
.btn{width:100%;background:linear-gradient(#E40012,#A8000A);color:white;border:none;padding:17px;border-radius:999px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #7A0007}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #7A0007}
.footer{padding:22px 16px 30px;text-align:center;color:white}
.footer p{font-size:19px;font-weight:700;font-style:italic}
.footer span{display:block;width:180px;height:5px;background:white;border-radius:99px;margin:8px auto 0;transform:rotate(-2deg)}
@media(min-width:600px){.top,.card{max-width:520px;margin-left:auto;margin-right:auto}.card{margin-top:16px}}
</style>
</head>
<body>
<div class="top"><div class="top-bg"></div>
  <div class="logo"><b><span>D</span> DoloYa</b><small></small></div>
  <div class="hero">
    <div class="hero-text"><h1>Registro de<span>Aliados</span></h1><p>Conecta tu negocio<br>con más clientes</p></div>
    <div class="hero-img"><img src="https://images.unsplash.com/photo-1556910103-1c02745aae4d?w=600&q=80" alt="Aliado DoloYa"></div>
  </div>
</div>

<div class="card">
  <label class="field"><span class="icon">🏪</span><input id="nombre" placeholder="Nombre de tu restaurante o negocio"></label>
  <label class="field"><span class="icon">🍴</span><select id="tipo"><option value="">Tipo de negocio</option><option>Restaurante</option><option>Taquería</option><option>Mariscos</option><option>Pizza</option><option>Hamburguesas</option><option>Café / Cafetería</option><option>Panadería</option><option>Antojitos</option><option>Otro</option></select><span class="arrow">⌄</span></label>
  <label class="field"><span class="icon">💬</span><input id="whats" type="tel" placeholder="Número de WhatsApp o Teléfono"></label>
  <label class="field"><span class="icon">📍</span><input id="direccion" placeholder="Dirección de tu establecimiento"></label>
  <label class="field file-field"><span class="icon">🖼️</span><span id="fileLabel">Imagen de tu negocio (logo o foto)</span><span style="font-size:28px">📷</span><input id="foto" type="file" accept="image/*" hidden></label>
  <img id="preview" class="preview">

  <div class="secure"><span class="shield">🛡️</span><div><b>Tu información está segura</b><p>Una vez que completes tu registro, te enviaremos la confirmación al WhatsApp.</p></div><span class="wa">🟢</span></div>

  <button class="btn" onclick="registrar()">Registrar mi negocio →</button>
</div>

<div class="footer"><p>DoloYa, tu negocio más cerca de tus clientes.</p><span></span></div>

<script>
const fotoInput=document.getElementById('foto');
fotoInput.addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  document.getElementById('fileLabel').textContent=f.name;
  const r=new FileReader(); r.onload=ev=>{const p=document.getElementById('preview');p.src=ev.target.result;p.style.display='block'};
  r.readAsDataURL(f);
});
function registrar(){
  const nombre=document.getElementById('nombre').value.trim();
  const tipo=document.getElementById('tipo').value;
  const whats=document.getElementById('whats').value.trim();
  const dir=document.getElementById('direccion').value.trim();
  if(!nombre||!tipo||!whats||!dir){alert('Bro, te faltó un dato. Llena todos los campos porfa 🙏');return;}
  const TU_NUMERO='5214610000000'; // <-- CAMBIA ESTE POR TU WHATSAPP REAL
  const msg=`Hola DoloYa! Quiero registrar mi negocio:%0A🏪 Negocio: ${encodeURIComponent(nombre)}%0A🍴 Tipo: ${encodeURIComponent(tipo)}%0A📱 WhatsApp: ${encodeURIComponent(whats)}%0A📍 Dirección: ${encodeURIComponent(dir)}`;
  window.open(`https://wa.me/${TU_NUMERO}?text=${msg}`,'_blank');
  alert('¡Listo! Ya se armó tu registro, ahora te confirmamos por WhatsApp ✅');
}
</script>
</body>
</html>
