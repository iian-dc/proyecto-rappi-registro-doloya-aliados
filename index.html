<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DoloYa - Registro de Aliados</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',Arial,sans-serif}
body{background:#D50012}
.wrap{max-width:480px;margin:0 auto;background:#D50012;overflow:hidden;position:relative;padding-bottom:18px}
/* HEADER */
.header{position:relative;background:#D50012;padding:14px 0 0;overflow:hidden}
.header-red{position:absolute;inset:0;background:radial-gradient(600px 300px at 10% 0%, #FF1A2A 0%, #D50012 55%, #A8000E 100%)}
.top-content{position:relative;z-index:2;display:flex}
.left{width:48%;padding:0 0 0 22px;color:#fff}
.logo-box{width:180px;height:120px;border:2px dashed rgba(255,255,255,.75);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;font-size:12px;line-height:1.3;background:rgba(255,255,255,.08);cursor:pointer;overflow:hidden}
.logo-box img{width:100%;height:100%;object-fit:contain}
.logo-box small{display:block;font-weight:700}
.header h1{font-size:36px;line-height:.92;font-weight:800;margin-top:14px;letter-spacing:-.5px}
.header h1 span{font-size:58px;font-weight:900;display:block;letter-spacing:-1px}
.header h1 i{display:block;width:150px;height:4px;background:#fff;border-radius:99px;margin-top:6px}
.header p{font-size:17px;font-weight:600;line-height:1.15;margin-top:10px}
.right{width:52%;position:relative}
.right-img{width:100%;height:285px;object-fit:cover;display:block;border-radius:110px 0 0 0;position:relative;z-index:2}
.right label{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.18);color:#fff;font-size:12px;font-weight:700;text-align:center;border-radius:110px 0 0 0;cursor:pointer}
.right img[src]{}
.curve{position:relative;height:28px;background:#fff;border-radius:28px 28px 0 0;margin-top:-18px;z-index:4}
/* CARD */
.card{background:#fff;margin:0 12px;border-radius:26px;padding:16px 12px 18px;box-shadow:0 12px 30px rgba(0,0,0,.18);position:relative;z-index:5}
.field{display:flex;align-items:center;gap:12px;background:#F1F1F1;border-radius:999px;padding:12px 14px;margin-bottom:11px;border:1px solid #EDEDED}
.field svg{width:32px;height:32px;flex-shrink:0}
.field input,.field select{border:none;background:transparent;outline:none;width:100%;font-size:15.5px;color:#4A4A4A;font-weight:500}
.field input::placeholder{color:#6B6B6B}
.field select{appearance:none;cursor:pointer;color:#4A4A4A}
.field .chev{color:#D50012;width:20px;height:20px;flex-shrink:0}
.file-row{cursor:pointer}
.file-row span{flex:1;font-size:14.5px;color:#5A5A5A;font-weight:500;line-height:1.2}
.file-row .cam{width:36px;height:36px;flex-shrink:0}
#preview{width:100%;height:180px;object-fit:cover;border-radius:16px;display:none;margin:-2px 0 11px}
/* SECURE */
.secure{display:flex;align-items:center;gap:10px;background:#FFD7DE;border-radius:16px;padding:13px 12px;margin-bottom:15px}
.secure .shield{width:44px;height:44px;flex-shrink:0}
.secure div{flex:1}
.secure b{color:#D50012;font-size:17px;line-height:1.1;display:block}
.secure p{font-size:12.5px;line-height:1.35;color:#1A1A1A;margin-top:3px}
.secure .wa{width:48px;height:48px;flex-shrink:0}
/* BUTTON */
.btn{width:100%;background:linear-gradient(180deg,#E60013 0%,#B0000E 100%);color:#fff;border:none;padding:16px;border-radius:999px;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 5px 0 #7A0007, 0 10px 18px rgba(213,0,18,.35)}
.btn svg{width:24px;height:24px}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #7A0007}
/* FOOTER */
.footer{text-align:center;padding:18px 20px 8px;color:#fff}
.footer p{font-size:18px;font-weight:700;font-style:italic;line-height:1.2}
.footer i{display:block;width:190px;height:6px;background:#fff;border-radius:99px;margin:9px auto 0;transform:rotate(-1deg)}
@media(min-width:520px){.wrap{border-radius:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="header"><div class="header-red"></div>
<div class="top-content">
<div class="left">
<label class="logo-box" for="logoInput"><span><small>SUBE AQUÍ<br>TU LOGO</small><br>DoloYa</span><img id="logoPreview" style="display:none"></label>
<input type="file" id="logoInput" accept="image/*" hidden>
<h1>Registro de<span>Aliados</span><i></i></h1>
<p>Conecta tu negocio<br>con más clientes</p>
</div>
<div class="right">
<img id="heroImg" class="right-img" src="https://images.unsplash.com/photo-1577219491135-ce391730fb2c?w=700&q=80">
<label for="heroInput">SUBIR FOTO<br>DEL CHEF / NEGOCIO</label>
<input type="file" id="heroInput" accept="image/*" hidden>
</div>
</div>
<div class="curve"></div>
</div>

<div class="card">
<label class="field">
<svg viewBox="0 0 24 24" fill="#D50012"><path d="M3 9l1.5-4.5A2 2 0 0 1 6.4 3h11.2a2 2 0 0 1 1.9 1.5L21 9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1zm4 2h10v8H7v-8zm2 2v4h2v-4H9zm5 0v4h2v-4h-2zM4 21h16v-2H4v2z"/></svg>
<input id="nombre" placeholder="Nombre de tu restaurante o negocio">
</label>

<label class="field">
<svg viewBox="0 0 24 24" fill="#D50012"><path d="M7 2a1 1 0 0 1 1 1v9a2 2 0 0 0 2 2h.5a2 2 0 0 0 2-2V4a1 1 0 1 1 2 0v8a2 2 0 0 0 2 2H17a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-5h-1v5a1 1 0 0 1-1 1H12a1 1 0 0 1-1-1v-5h-1v5a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/></svg>
<select id="tipo"><option value="">Tipo de negocio</option><option>Restaurante</option><option>Taquería</option><option>Mariscos</option><option>Pizza</option><option>Hamburguesas</option><option>Café / Cafetería</option><option>Panadería</option><option>Antojitos</option><option>Otro</option></select>
<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#D50012" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>
</label>

<label class="field">
<svg viewBox="0 0 24 24" fill="#D50012"><path d="M12 2a10 10 0 0 0-10 10c0 5.5 8.5 10 9 10.2a1 1 0 0 0 2 0C13.5 22 22 17.5 22 12A10 10 0 0 0 12 2zm5.2 14.2c-.7.7-2.3 1.2-3.3.5-1.2-.8-2.2-1.8-3-3-.7-1-1.2-2.6-.5-3.3l1-1a1 1 0 0 1 1.4 0l1.2 1.2a1 1 0 0 1 0 1.4c-.2.2-.3.4-.2.6.2.5.9 1.2 1.4 1.4.2.1.4 0 .6-.2a1 1 0 0 1 1.4 0l1.2 1.2a1 1 0 0 1 0 1.4l-1.2 1z"/></svg>
<input id="whats" type="tel" placeholder="Número de WhatsApp o Teléfono">
</label>

<label class="field">
<svg viewBox="0 0 24 24" fill="#D50012"><path d="M12 2a8 8 0 0 0-8 8c0 6 8 12 8 12s8-6 8-12a8 8 0 0 0-8-8zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
<input id="direccion" placeholder="Dirección de tu establecimiento">
</label>

<label class="field file-row" for="fotoInput">
<svg viewBox="0 0 24 24" fill="#D50012"><path d="M21 19V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2zM8 9a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm9 9l-4-4-6 6h12l-2-2z"/></svg>
<span id="fileLabel">Imagen de tu negocio (logo o foto)</span>
<svg class="cam" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8"><path d="M3 7h3l2-2h8l2 2h3v12H3z"/><circle cx="12" cy="13" r="3.5"/><circle cx="12" cy="13" r="1.5" fill="#111"/></svg>
</label>
<input type="file" id="fotoInput" accept="image/*" hidden>
<img id="preview">

<div class="secure">
<svg class="shield" viewBox="0 0 24 24" fill="#D50012"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5l8-3zm-1.2 13.6l4.5-4.5-1.4-1.4-3.1 3.1-1.6-1.6-1.4 1.4 3 3z"/></svg>
<div><b>Tu información está segura</b><p>Una vez que completes tu registro, te enviaremos la confirmación al WhatsApp.</p></div>
<svg class="wa" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#25D366"/><path fill="#fff" d="M12 7a5 5 0 0 0-4.3 7.6L7 17l2.5-.7A5 5 0 1 0 12 7zm0 8.4c-.5 0-1-.1-1.4-.3l-.1-.1-1.5.4.4-1.4-.1-.1A3.4 3.4 0 1 1 12 15.4zm1.9-2.6c-.1-.1-.3-.1-.5 0-.1.1-.5.3-.6.3-.1.1-.2.1-.3 0a2.8 2.8 0 0 1-1.4-1.2c-.1-.2 0-.3.1-.4l.3-.3c.1-.1.1-.2 0-.3l-.3-.7c-.1-.2-.2-.2-.3-.2h-.3c-.1 0-.3 0-.4.2-.1.2-.6.6-.6 1.4s.6 1.6.7 1.7c.1.1 1.2 1.9 3 2.6.4.2.7.3.9.3.4.1.7.1 1-.1.3-.1.5-.3.6-.5l.3-.7c.1-.2 0-.3-.1-.4l-.6-.3z"/></svg>
</div>

<button class="btn" onclick="registrar()">Registrar mi negocio <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
</div>

<div class="footer"><p>DoloYa, tu negocio más cerca de tus clientes.</p><i></i></div>
</div>

<script>
function previewFile(input, imgId, labelId){
  const f=input.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=e=>{const im=document.getElementById(imgId); im.src=e.target.result; im.style.display='block'; if(labelId) document.getElementById(labelId).textContent=f.name;}; r.readAsDataURL(f);
}
document.getElementById('logoInput').addEventListener('change',e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{const im=document.getElementById('logoPreview'); im.src=ev.target.result; im.style.display='block';}; r.readAsDataURL(f);});
document.getElementById('heroInput').addEventListener('change',e=>previewFile(e.target,'heroImg'));
document.getElementById('fotoInput').addEventListener('change',e=>previewFile(e.target,'preview','fileLabel'));
function registrar(){
  const nombre=document.getElementById('nombre').value.trim();
  const tipo=document.getElementById('tipo').value;
  const whats=document.getElementById('whats').value.trim();
  const dir=document.getElementById('direccion').value.trim();
  if(!nombre||!tipo||!whats||!dir){alert('Te faltó un dato. Llena todos los campos porfa');return;}
  const TU_NUMERO='5214610000000';
  const msg=`Hola DoloYa! Quiero registrar mi negocio:%0A- Negocio: ${encodeURIComponent(nombre)}%0A- Tipo: ${encodeURIComponent(tipo)}%0A- WhatsApp: ${encodeURIComponent(whats)}%0A- Dirección: ${encodeURIComponent(dir)}`;
  window.open(`https://wa.me/${TU_NUMERO}?text=${msg}`,'_blank');
}
</script>
</body>
</html>
